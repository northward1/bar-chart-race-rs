[package]
name = "bar-chart-race"
version = "0.2.0"
edition = "2024"
description = "A fast and customizable Bar Chart Race generator in Rust using Plotters"
license = "MIT"
repository = "https://github.com/northward1/bar-chart-race-rs"
readme = "README.md"
keywords = ["visualization", "chart", "bar-chart-race", "plotters", "animation"]
categories = ["visualization", "command-line-utilities"]
exclude = ["*.gif"]

[dependencies]
plotters = { version = "0.3", default-features = false, features = ["bitmap_backend", "bitmap_encoder", "all_elements", "ttf"] }
csv = "1.4"
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
thiserror = "2.0"
image = { version = "0.25", default-features = false, features = ["gif", "png"] }

[dev-dependencies]
tempfile = "3.17"

# Enable optimizations for dependencies (plotters, image, color_quant) even in dev mode
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
